name: Avaliar resposta

# pull_request_target, e não pull_request, por um motivo concreto: um pull
# request vindo de FORK recebe token somente-leitura, e o robô levava 403 ao
# tentar comentar a nota. Com pull_request_target o job roda no contexto do
# repositório base e consegue escrever.
#
# Isso exige cuidado, porque o token tem permissão de escrita:
#   - os scripts vêm do checkout da BASE (confiáveis, são os nossos)
#   - do fork vem SÓ a pasta respostas/, e só como dado
#   - nada do fork é executado — o avaliador apenas LÊ os CSVs
# A solução enviada pode conter um solucao.py; ele nunca é executado aqui.
on:
  pull_request_target:
    paths:
      - 'respostas/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  avaliar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório base (scripts confiáveis)
        uses: actions/checkout@v4

      - name: Trazer só as respostas do pull request
        # apenas dados. Nenhum código do fork entra no PATH de execução.
        run: |
          git fetch --no-tags --depth=1 origin \
            "+refs/pull/${{ github.event.pull_request.number }}/head:refs/remotes/pr"
          rm -rf respostas
          git checkout refs/remotes/pr -- respostas
          find respostas -type f -name '*.csv' | head -20

      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Conferir a integridade dos dados
        run: python desafio/ferramentas/conferir_dados.py

      - name: Gerar o baseline de referência
        # o score é normalizado contra o baseline
        run: |
          python desafio/ferramentas/baseline_atual.py --janela public
          python desafio/ferramentas/baseline_atual.py --janela private

      - name: Avaliar as respostas
        id: nota
        continue-on-error: true
        run: python desafio/ferramentas/avaliar_pr.py --saida nota.md

      - name: Publicar no resumo da execução
        if: always()
        run: cat nota.md >> "$GITHUB_STEP_SUMMARY" || echo "sem nota" >> "$GITHUB_STEP_SUMMARY"

      - name: Comentar no pull request
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let corpo;
            try {
              corpo = fs.readFileSync('nota.md', 'utf8');
            } catch (e) {
              corpo = '## Nota da sua resposta\n\nO avaliador não conseguiu rodar. ' +
                      'Veja o log da execução para o motivo.';
            }
            const marca = '<!-- nota-do-desafio -->';
            const { owner, repo } = context.repo;
            const numero = context.payload.pull_request.number;

            // atualiza o comentário anterior em vez de empilhar um novo a cada envio
            const anteriores = await github.rest.issues.listComments({
              owner, repo, issue_number: numero, per_page: 100
            });
            const meu = anteriores.data.find(c =>
              c.user.type === 'Bot' && c.body.includes(marca));

            const texto = `${marca}\n${corpo}`;
            if (meu) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: meu.id, body: texto });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number: numero, body: texto });
            }

      - name: Falhar se alguma resposta foi reprovada
        if: steps.nota.outcome == 'failure'
        run: |
          echo "Uma ou mais respostas foram reprovadas nos gates."
          echo "A nota comentada no pull request explica o motivo."
          exit 1
